<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>多因子相关性分析系统 · OpenCode 工程实践</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<script>
  window.DECK_MANIFEST = [
    { file: "slides/01-architecture.html",  label: "系统架构全景" },
    { file: "slides/02-cover.html",         label: "OpenCode 驱动开发" },
    { file: "slides/03-skills.html",        label: "OpenCode 技能体系" },
    { file: "slides/04-mcp.html",           label: "MCP 工具集成" },
    { file: "slides/05-agents-md.html",     label: "AGENTS.md 契约体系" },
    { file: "slides/06-refactor.html",      label: "架构熵增与人工收口" },
    { file: "slides/07-behavior.html",      label: "开发行为规范" },
    { file: "slides/08-stability.html",     label: "稳定性工程保障" },
  ];

  window.DECK_WIDTH = 1920;
  window.DECK_HEIGHT = 1080;
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg-page: #050507;
    --accent: #3b82f6;
    --border: rgba(255, 255, 255, 0.08);
  }
  
  html, body {
    height: 100%;
    background: var(--bg-page);
    overflow: hidden;
    font-family: 'Outfit', -apple-system, "PingFang SC", sans-serif;
  }
  
  /* 噪点叠加 */
  body::after {
    content: ''; position: absolute; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3%3Ffilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    opacity: 0.03; pointer-events: none; z-index: 100;
  }

  /* 酷炫背景网格 */
  body::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 24px 24px;
    mask-image: radial-gradient(circle at center, black, transparent 80%);
    pointer-events: none; z-index: 1;
  }

  #stage {
    position: fixed; top: 50%; left: 50%; transform-origin: top left; will-change: transform;
    background: #000;
    box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.9);
    border: 1.5px solid var(--border);
    overflow: hidden; z-index: 10;
  }
  
  iframe { width: 100%; height: 100%; border: 0; display: block; background: #000; }
  
  /* 磨砂玻璃状态条 */
  .counter {
    position: fixed; bottom: 32px; right: 32px;
    background: rgba(10, 10, 12, 0.7); backdrop-filter: blur(20px);
    border: 1.5px solid var(--border); color: #fff;
    padding: 10px 24px; border-radius: 4px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
    z-index: 100; user-select: none;
    display: flex; align-items: center; gap: 16px;
    transition: all 0.4s cubic-bezier(0.2, 1, 0.2, 1);
  }
  .counter:hover { border-color: var(--accent); box-shadow: 0 0 30px rgba(59, 130, 246, 0.1); transform: translateY(-2px); }
  .counter .slide-idx { font-family: 'JetBrains Mono', monospace; color: var(--accent); }
  .counter .divider { width: 1.5px; height: 16px; background: var(--border); }
  .counter .label { color: #a1a1aa; text-transform: uppercase; font-size: 11px; }
  
  /* 侧边导航区 */
  .nav-zone {
    position: fixed; top: 0; bottom: 0; width: 10%; cursor: pointer; z-index: 50;
    display: flex; align-items: center; justify-content: center;
  }
  .nav-zone.left  { left: 0; }
  .nav-zone.right { right: 0; }
  
  .nav-hint {
    width: 48px; height: 48px; border-radius: 4px;
    background: rgba(10, 10, 12, 0.5); backdrop-filter: blur(10px);
    border: 1.5px solid var(--border); color: #52525b;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; opacity: 0; transform: scale(0.9);
    transition: all 0.3s cubic-bezier(0.2, 1, 0.2, 1);
  }
  .nav-zone:hover .nav-hint { opacity: 1; transform: scale(1); color: var(--accent); border-color: var(--accent); }

  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    html, body { background: #000; overflow: visible; height: auto; }
    #stage { position: static; transform: none !important; box-shadow: none; border: none; }
    .counter, .nav-zone { display: none !important; }
    .print-stack { display: block; }
    .print-stack iframe { width: 1920px; height: 1080px; page-break-after: always; display: block; }
  }
</style>
</head>
<body>

<div id="stage">
  <iframe id="frame" src="about:blank"></iframe>
</div>

<div class="nav-zone left"  id="navL"><div class="nav-hint">&#8249;</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">&#8250;</div></div>

<div class="counter" id="counter">
  <span class="slide-idx" id="slideIdx">1 / 1</span>
  <span class="divider"></span>
  <span class="label" id="slideLabel">Loading</span>
</div>

<div class="print-stack" id="printStack" style="display:none;"></div>

<script>
(function () {
  const W = window.DECK_WIDTH || 1920;
  const H = window.DECK_HEIGHT || 1080;
  const deck = window.DECK_MANIFEST || [];
  const stage = document.getElementById('stage');
  const frame = document.getElementById('frame');
  const slideIdx = document.getElementById('slideIdx');
  const slideLabel = document.getElementById('slideLabel');
  const printStack = document.getElementById('printStack');
  const storageKey = 'deck-opencode-workflow-v2';
  let current = 0;

  stage.style.width  = W + 'px';
  stage.style.height = H + 'px';

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    const x = (window.innerWidth  - W * s) / 2;
    const y = (window.innerHeight - H * s) / 2;
    stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    stage.style.top = '0'; stage.style.left = '0';
  }

  function show(idx) {
    if (idx < 0 || idx >= deck.length) return;
    current = idx;
    frame.src = deck[idx].file;
    slideIdx.innerText = `${idx + 1} / ${deck.length}`;
    slideLabel.innerText = deck[idx].label || '';
    try { localStorage.setItem(storageKey, String(idx)); } catch (_) {}
    if (location.hash !== '#' + (idx + 1)) {
      history.replaceState(null, '', '#' + (idx + 1));
    }
  }

  function next() { show(Math.min(current + 1, deck.length - 1)); }
  function prev() { show(Math.max(current - 1, 0)); }

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case 'ArrowRight': case ' ': case 'PageDown': e.preventDefault(); next(); break;
      case 'ArrowLeft':  case 'PageUp':              e.preventDefault(); prev(); break;
      case 'Home':                                    e.preventDefault(); show(0); break;
      case 'End':                                     e.preventDefault(); show(deck.length - 1); break;
      case 'p': case 'P':                             window.print(); break;
    }
  });

  document.getElementById('navL').addEventListener('click', prev);
  document.getElementById('navR').addEventListener('click', next);
  window.addEventListener('resize', fit);
  window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#(\d+)$/);
    if (m) show(parseInt(m[1], 10) - 1);
  });

  const hashMatch = location.hash.match(/^#(\d+)$/);
  if (hashMatch) current = Math.min(parseInt(hashMatch[1], 10) - 1, deck.length - 1);
  else try {
    const v = parseInt(localStorage.getItem(storageKey), 10);
    if (!isNaN(v) && v >= 0 && v < deck.length) current = v;
  } catch (_) {}
  fit(); show(current);

  window.addEventListener('beforeprint', () => {
    printStack.innerHTML = '';
    deck.forEach(item => {
      const f = document.createElement('iframe');
      f.src = item.file;
      printStack.appendChild(f);
    });
    printStack.style.display = 'block';
    document.getElementById('stage').style.display = 'none';
  });
  window.addEventListener('afterprint', () => {
    printStack.innerHTML = '';
    printStack.style.display = 'none';
    document.getElementById('stage').style.display = '';
  });
})();
</script>

</body>
</html>
